<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meditation Timer | บันทึกการนั่งสมาธิ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .breathing { animation: breathe 5s ease-in-out infinite; }
        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.7; box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.4); }
            50% { transform: scale(1.06); opacity: 1; box-shadow: 0 0 30px 20px rgba(56, 189, 248, 0.25); }
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col items-center py-10 px-4 transition-colors duration-300">

    <main class="w-full max-w-md space-y-8">
        <!-- Header & Login -->
        <header class="text-center space-y-3">
            <div id="userBadge" class="hidden text-xs font-semibold bg-teal-50 dark:bg-teal-950/50 text-teal-700 dark:text-teal-400 border border-teal-100 dark:border-teal-900/40 px-3 py-1.5 rounded-full inline-flex items-center gap-1.5">
                <span>🧘 อีเมล:</span><span id="userNameDisplay">--</span>
                <button onclick="logout()" class="ml-2 text-rose-500 underline">ออก</button>
            </div>

            <div id="usernameBox" class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-teal-100 dark:border-teal-800 shadow-sm">
                <label class="text-sm font-medium mb-2 block">กรอกอีเมลเพื่อเข้าใช้/เชื่อมต่อข้อมูล:</label>
                <input type="email" id="customUsernameInput" placeholder="อีเมลของคุณ..." class="w-full bg-slate-100 dark:bg-slate-800 border-0 rounded-xl px-4 py-3 mb-3 focus:ring-2 focus:ring-teal-500">
                <button onclick="saveCustomUsername()" class="w-full bg-teal-600 text-white py-3 rounded-xl font-medium">เข้าสู่ระบบ</button>
            </div>

            <h1 class="text-2xl font-semibold pt-4">Meditation Timer</h1>
        </header>

        <!-- Timer -->
        <section class="bg-white dark:bg-slate-900 p-8 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-800 text-center space-y-6">
            <div id="statusIndicator" class="w-24 h-24 mx-auto bg-teal-50 dark:bg-teal-950/40 text-teal-600 rounded-full flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            </div>
            <div>
                <p id="timerStatus" class="text-lg font-medium">พร้อมเริ่มต้น</p>
                <p id="liveDuration" class="text-5xl font-light text-slate-400">00:00</p>
            </div>
            <button id="toggleBtn" onclick="toggleTimer()" class="w-full py-4 rounded-2xl bg-teal-600 text-white font-medium">เริ่มนั่งสมาธิ</button>
        </section>

        <!-- History -->
        <section class="space-y-4">
            <h3 class="text-lg font-medium">ประวัติการนั่งสมาธิ</h3>
            <ul id="historyList" class="space-y-3"></ul>
        </section>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBW_KT7TJAThSg29gedQurkXhcTv5ACOmg",
            authDomain: "dharma-prayer.firebaseapp.com",
            databaseURL: "https://dharma-prayer-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "dharma-prayer",
            storageBucket: "dharma-prayer.firebasestorage.app",
            messagingSenderId: "4576358277",
            appId: "1:4576358277:web:17240edf90e461cb489eec"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let isMeditating = false, startTime = null, historyRef = null;
        let rawEmail = localStorage.getItem('user_display_email') || '';

        function convertEmailToPath(email) {
            return email.trim().toLowerCase().replace(/@/g, '_at_').replace(/\./g, '_dot_').replace(/[#$\[\]]/g, "_");
        }

        // ปรับให้รองรับทุกอีเมล โดยไม่ต้องเช็คเงื่อนไขตายตัว
        function saveCustomUsername() {
            const val = document.getElementById('customUsernameInput').value.trim().toLowerCase();
            if (!val || !val.includes('@')) return alert("กรุณากรอกอีเมลให้ถูกต้อง");
            
            // บันทึกอีเมลลง LocalStorage เพื่อให้เข้าสู่ระบบได้ทันที
            localStorage.setItem('user_display_email', val);
            rawEmail = val;
            location.reload(); // โหลดหน้าใหม่เพื่อแสดงประวัติของอีเมลนั้น
        }

        function logout() {
            localStorage.removeItem('user_display_email');
            location.reload();
        }

        function checkLogin() {
            if (rawEmail) {
                document.getElementById('userBadge').classList.remove('hidden');
                document.getElementById('usernameBox').classList.add('hidden');
                document.getElementById('userNameDisplay').textContent = rawEmail;
                const path = convertEmailToPath(rawEmail);
                
                // ดึงประวัติจาก Path ที่แปลงจากอีเมลโดยตรง
                historyRef = database.ref(`meditation_users/${path}/history`);
                historyRef.on('value', (snap) => {
                    const data = snap.val();
                    renderHistory(data);
                });
            }
        }

        function renderHistory(data) {
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            if (!data) return list.innerHTML = '<li class="text-center p-4 text-slate-400">ยังไม่มีประวัติ</li>';
            
            Object.keys(data).reverse().forEach(key => {
                const s = data[key];
                list.innerHTML += `<li class="bg-white dark:bg-slate-900 p-4 rounded-xl border flex justify-between">
                    <span>${s.date} | ${s.startTime}-${s.endTime}</span>
                    <span class="font-bold text-teal-600">${s.duration} นาที</span>
                </li>`;
            });
        }

        function toggleTimer() {
            if (!isMeditating) {
                isMeditating = true;
                startTime = new Date();
                document.getElementById('toggleBtn').textContent = 'บันทึกเวลา';
                document.getElementById('timerStatus').textContent = 'กำลังนั่งสมาธิ...';
            } else {
                isMeditating = false;
                const endTime = new Date();
                const duration = Math.round((endTime - startTime) / 60000);
                if (rawEmail) {
                    const path = convertEmailToPath(rawEmail);
                    database.ref(`meditation_users/${path}/history`).push({
                        date: new Date().toLocaleDateString('th-TH'),
                        startTime: startTime.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'}),
                        endTime: endTime.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'}),
                        duration: duration
                    });
                }
                document.getElementById('toggleBtn').textContent = 'เริ่มนั่งสมาธิ';
                document.getElementById('timerStatus').textContent = 'พร้อมเริ่มต้น';
                alert(`บันทึกเวลาสมาธิเรียบร้อย: ${duration} นาที`);
            }
        }

        checkLogin();
    </script>
</body>
</html>
