<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meditation Timer | บันทึกการนั่งสมาธิ</title>
    <!-- นำเข้า Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // ตั้งค่า Tailwind ให้รองรับ Class-based Dark Mode
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <!-- นำเข้าฟอนต์ Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .breathing {
            animation: breathe 5s ease-in-out infinite;
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.7; box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.4); }
            50% { transform: scale(1.06); opacity: 1; box-shadow: 0 0 30px 20px rgba(56, 189, 248, 0.25); }
        }
        
        /* จัดการหน้าตากล่องเวลาให้คงที่และเสถียรบน iOS Safari */
        input[type="time"] {
            box-sizing: border-box;
            width: 100%;
            max-width: 100%;
            -webkit-appearance: none;
            appearance: none;
        }
        
        /* บังคับข้อความตัวเลขบอกเวลาให้อยู่กึ่งกลางพอดี */
        input[type="time"]::-webkit-date-and-time-value {
            display: block;
            text-align: center;
            width: 100%;
            min-height: 1.5em;
        }
        input[type="time"]::-webkit-datetime-edit {
            text-align: center;
            width: 100%;
        }
    </style>
    <script>
        // หน้าหลักเริ่มต้นที่โหมดสว่างเสมอ
        (function() {
            const isDark = localStorage.getItem('darkMode') === 'enabled';
            if (isDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased min-h-screen flex flex-col items-center py-10 px-4 sm:px-6 transition-colors duration-300">

    <!-- ปุ่มสลับโหมดมืด/สว่าง -->
    <button id="darkModeToggle" onclick="toggleDarkMode()" class="fixed top-4 right-4 p-3 rounded-full bg-white dark:bg-slate-900 shadow-md border border-slate-100 dark:border-slate-800 text-slate-600 dark:text-slate-300 active:scale-95 transition-all z-50 hover:bg-slate-100 dark:hover:bg-slate-800" aria-label="Toggle dark mode">
        <!-- ไอคอนพระจันทร์ (แสดงตอนโหมดสว่าง) -->
        <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 block dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
        <!-- ไอคอนพระอาทิตย์ (แสดงตอนโหมดมืด) -->
        <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-11.314l.707.707m11.314 11.314l.707-.707M12 5a7 7 0 100 14 7 7 0 000-14z" />
        </svg>
    </button>

    <main class="w-full max-w-md space-y-8">
         
        <!-- Header -->
        <header class="text-center space-y-3">
            <h1 class="text-3xl font-semibold text-slate-900 dark:text-white">Meditation Timer</h1>
            <p class="text-base text-slate-500 dark:text-slate-400">บันทึกเวลาแห่งความสงบของคุณ</p>
        </header>

        <!-- โหมดจับเวลาปัจจุบัน (Live Timer) -->
        <section class="bg-white dark:bg-slate-900 p-6 sm:p-8 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-800 text-center space-y-8 transition-colors duration-300">
            <!-- วงกลมสัญลักษณ์สมาธิ -->
            <div id="statusIndicator" class="w-28 h-28 mx-auto bg-teal-50 dark:bg-teal-950/40 text-teal-600 dark:text-teal-400 rounded-full flex items-center justify-center transition-all duration-700">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-14 w-14" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
             
            <div class="space-y-2">
                <h2 id="timerStatus" class="text-xl font-medium dark:text-slate-200 transition-colors duration-500">พร้อมเริ่มต้น</h2>
                <p id="liveDuration" class="text-5xl font-light text-slate-400 dark:text-slate-500 tracking-wider">00:00</p>
            </div>

            <!-- การ์ดเวลาเริ่มต้น -->
            <div id="startTimeCard" class="hidden transform translate-y-2 opacity-0 transition-all duration-500 bg-sky-50 dark:bg-sky-950/40 text-sky-700 dark:text-sky-400 text-sm font-medium py-2.5 px-5 rounded-2xl mx-auto inline-block border border-sky-100 dark:border-sky-900/50">
                เวลาเริ่มต้นของคุณ <span id="startTimeDisplay" class="font-semibold">--:--</span> น.
            </div>

            <!-- ปุ่มหลัก -->
            <button id="toggleBtn" onclick="toggleTimer()" class="w-full py-4 rounded-2xl text-lg font-medium text-white bg-teal-600 hover:bg-teal-700 active:scale-95 transition-all shadow-md">
                เริ่มนั่งสมาธิ (เวลาปัจจุบัน)
            </button>
        </section>

        <!-- โหมดระบุเวลาเอง (Manual Entry) -->
        <section class="bg-white dark:bg-slate-900 p-6 sm:p-8 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-800 space-y-6 transition-colors duration-300">
            <h3 class="text-lg font-medium text-slate-800 dark:text-slate-200">ระบุเวลาด้วยตนเอง</h3>
             
            <div class="space-y-5">
                <!-- เวลาเริ่ม -->
                <div class="flex flex-col gap-2">
                    <div class="flex justify-between items-center">
                        <label class="text-sm text-slate-600 dark:text-slate-400 font-medium">เวลาเริ่ม</label>
                        <button onclick="setCurrentTime('manualStart')" class="text-xs text-teal-700 dark:text-teal-400 hover:text-teal-800 dark:hover:text-teal-300 active:scale-95 font-medium transition-all bg-teal-50 dark:bg-teal-950/40 hover:bg-teal-100 dark:hover:bg-teal-900/60 px-3 py-1.5 rounded-lg border border-teal-100 dark:border-teal-900/50">
                            เพิ่มเวลาตอนนี้
                        </button>
                    </div>
                    <!-- เคลียร์คำสั่งครอบกันขอบล้นตัวเก่าออก และปล่อยให้ขยายสมมาตรซ้ายขวาอย่างเท่าเทียม -->
                    <div class="w-full">
                        <input type="time" id="manualStart" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3.5 text-base text-center focus:outline-none focus:ring-2 focus:ring-teal-500 font-medium dark:text-white">
                    </div>
                </div>
                 
                <!-- เวลาสิ้นสุด -->
                <div class="flex flex-col gap-2">
                    <div class="flex justify-between items-center">
                        <label class="text-sm text-slate-600 dark:text-slate-400 font-medium">เวลาสิ้นสุด</label>
                        <button onclick="setCurrentTime('manualEnd')" class="text-xs text-teal-700 dark:text-teal-400 hover:text-teal-800 dark:hover:text-teal-300 active:scale-95 font-medium transition-all bg-teal-50 dark:bg-teal-950/40 hover:bg-teal-100 dark:hover:bg-teal-900/60 px-3 py-1.5 rounded-lg border border-teal-100 dark:border-teal-900/50">
                            เพิ่มเวลาตอนนี้
                        </button>
                    </div>
                    <!-- เคลียร์คำสั่งครอบกันขอบล้นตัวเก่าออก และปล่อยให้ขยายสมมาตรซ้ายขวาอย่างเท่าเทียม -->
                    <div class="w-full">
                        <input type="time" id="manualEnd" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3.5 text-base text-center focus:outline-none focus:ring-2 focus:ring-teal-500 font-medium dark:text-white">
                    </div>
                </div>
            </div>
             
            <!-- ปุ่มคำนวณเวลา -->
            <button onclick="saveManualEntry()" class="w-full py-3.5 rounded-2xl text-base font-medium text-teal-800 dark:text-teal-300 bg-teal-50 dark:bg-teal-950/40 hover:bg-teal-100 dark:hover:bg-teal-900/60 transition-all border border-teal-100 dark:border-teal-900/50">
                คำนวณเวลา/บันทึกเวลา
            </button>
        </section>

        <!-- ประวัติการใช้งาน (History) -->
        <section class="space-y-4 pt-2">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-medium text-slate-800 dark:text-slate-200">ประวัติการนั่งสมาธิ</h3>
                <span id="totalStats" class="text-sm font-medium text-teal-700 dark:text-teal-400 bg-teal-50 dark:bg-teal-950/40 px-3 py-1.5 rounded-lg border border-teal-100 dark:border-teal-900/50">รวม 0 นาที</span>
            </div>
            <ul id="historyList" class="space-y-4">
                <!-- ข้อมูลประวัติจะถูกเรนเดอร์ที่นี่ผ่าน JS -->
            </ul>
        </section>

    </main>

    <script>
        // State Management
        let isMeditating = false;
        let startTime = null;
        let timerInterval = null;
        let history = JSON.parse(localStorage.getItem('meditationHistory')) || [];

        // DOM Elements
        const toggleBtn = document.getElementById('toggleBtn');
        const statusIndicator = document.getElementById('statusIndicator');
        const timerStatus = document.getElementById('timerStatus');
        const liveDuration = document.getElementById('liveDuration');
        const historyList = document.getElementById('historyList');
        const totalStats = document.getElementById('totalStats');
        const startTimeCard = document.getElementById('startTimeCard');
        const startTimeDisplay = document.getElementById('startTimeDisplay');

        // Initialize
        renderHistory();

        // ฟังก์ชันสลับโหมดมืด / โหมดสว่าง
        // หน้าหลักเริ่มที่โหมดสว่าง หากเลือกปิดหรือเปิดใหม่จะคงค่าไว้
        function toggleDarkMode() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('darkMode', 'disabled');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('darkMode', 'enabled');
            }
        }

        // ฟังก์ชันช่วยดึงเวลาปัจจุบันใส่ใน Input ช่องระบุเวลาเอง
        function setCurrentTime(inputId) {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById(inputId).value = `${hours}:${minutes}`;
        }

        // ฟังก์ชันแปลงนาทีรวม ให้กลายเป็นหน่วย ชั่วโมง และ นาที ที่เข้าใจง่าย
        function formatMinutesToReadable(totalMinutes) {
            const hours = Math.floor(totalMinutes / 60);
            const mins = totalMinutes % 60;
             
            let result = '';
            if (hours > 0) result += `${hours} ชม. `;
            if (mins > 0 || hours === 0) result += `${mins} นาที`;
            return result;
        }

        // --- Live Timer Logic ---
        function toggleTimer() {
            if (!isMeditating) {
                isMeditating = true;
                startTime = new Date();
                 
                const startHours = String(startTime.getHours()).padStart(2, '0');
                const startMinutes = String(startTime.getMinutes()).padStart(2, '0');
                startTimeDisplay.textContent = `${startHours}:${startMinutes}`;
                 
                startTimeCard.classList.remove('hidden');
                setTimeout(() => {
                    startTimeCard.classList.remove('translate-y-2', 'opacity-0');
                }, 50);
                 
                toggleBtn.textContent = 'เลิกนั่งสมาธิ (บันทึกเวลา)';
                toggleBtn.classList.replace('bg-teal-600', 'bg-sky-400');
                toggleBtn.classList.replace('hover:bg-teal-700', 'hover:bg-sky-500');
                 
                statusIndicator.classList.add('breathing', 'bg-sky-100', 'text-sky-500');
                statusIndicator.classList.remove('bg-teal-50', 'text-teal-600');
                 
                timerStatus.textContent = 'กำลังนั่งสมาธิ...';
                timerStatus.classList.add('text-sky-600', 'dark:text-sky-400');

                timerInterval = setInterval(updateLiveDuration, 1000);
            } else {
                isMeditating = false;
                const endTime = new Date();
                clearInterval(timerInterval);
                 
                const durationMinutes = Math.round((endTime - startTime) / 60000);
                 
                if (durationMinutes > 0) {
                    saveSession(startTime, endTime, durationMinutes);
                } else {
                    alert('เวลาสั้นเกินไป (น้อยกว่า 1 นาที) จะไม่ถูกบันทึก');
                }

                startTimeCard.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => {
                    startTimeCard.classList.add('hidden');
                }, 500);

                toggleBtn.textContent = 'เริ่มนั่งสมาธิ (เวลาปัจจุบัน)';
                toggleBtn.classList.replace('bg-sky-400', 'bg-teal-600');
                toggleBtn.classList.replace('hover:bg-sky-500', 'hover:bg-teal-700');
                 
                statusIndicator.classList.remove('breathing', 'bg-sky-100', 'text-sky-500');
                statusIndicator.classList.add('bg-teal-50', 'text-teal-600');
                 
                timerStatus.textContent = 'พร้อมเริ่มต้น';
                timerStatus.classList.remove('text-sky-600', 'dark:text-sky-400');
                liveDuration.textContent = '00:00';
            }
        }

        function updateLiveDuration() {
            const now = new Date();
            const diffSeconds = Math.floor((now - startTime) / 1000);
            const minutes = String(Math.floor(diffSeconds / 60)).padStart(2, '0');
            const seconds = String(diffSeconds % 60).padStart(2, '0');
            liveDuration.textContent = `${minutes}:${seconds}`;
        }

        // --- Manual Entry Logic ---
        function saveManualEntry() {
            const startInput = document.getElementById('manualStart').value;
            const endInput = document.getElementById('manualEnd').value;

            if (!startInput || !endInput) {
                alert('กรุณาระบุทั้งเวลาเริ่มและเวลาสิ้นสุด');
                return;
            }

            const today = new Date().toISOString().split('T')[0];
            const startObj = new Date(`${today}T${startInput}`);
            let endObj = new Date(`${today}T${endInput}`);

            if (endObj < startObj) {
                endObj.setDate(endObj.getDate() + 1);
            }

            const durationMinutes = Math.round((endObj - startObj) / 60000);
             
            if (durationMinutes === 0) {
                alert('เวลาเริ่มต้นและสิ้นสุดตรงกันพอดี กรุณาตรวจสอบอีกครั้ง');
                return;
            }

            saveSession(startObj, endObj, durationMinutes);
             
            document.getElementById('manualStart').value = '';
            document.getElementById('manualEnd').value = '';
        }

        // --- Core Data & Render Logic ---
        function saveSession(start, end, duration) {
            const session = {
                id: Date.now(),
                date: start.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' }),
                startTime: start.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }),
                endTime: end.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }),
                duration: duration
            };

            history.unshift(session);
            localStorage.setItem('meditationHistory', JSON.stringify(history));
            renderHistory();
        }

        function deleteSession(id) {
            if(confirm('คุณต้องการลบประวัติรายการนี้ใช่หรือไม่?')) {
                history = history.filter(session => session.id !== id);
                localStorage.setItem('meditationHistory', JSON.stringify(history));
                renderHistory();
            }
        }

        function renderHistory() {
            historyList.innerHTML = '';
            let totalMinutes = 0;

            if (history.length === 0) {
                historyList.innerHTML = '<li class="text-center text-base text-slate-400 dark:text-slate-500 py-6 bg-white dark:bg-slate-900 rounded-2xl border border-slate-100 dark:border-slate-800 shadow-sm">ยังไม่มีประวัติการนั่งสมาธิ</li>';
            } else {
                // คำนวณเวลารวมแยกแต่ละวันไว้ล่วงหน้า
                const dailyTotals = {};
                history.forEach(session => {
                    dailyTotals[session.date] = (dailyTotals[session.date] || 0) + session.duration;
                });

                let lastDate = null;
                history.forEach(session => {
                    totalMinutes += session.duration;
                     
                    // หากเป็นวันใหม่ ให้แทรกแถวหัวข้อคั่นเพื่อแบ่งวัน และแสดงเวลารวมของวันนั้น
                    if (session.date !== lastDate) {
                        lastDate = session.date;
                        const dividerLi = document.createElement('li');
                        dividerLi.className = 'pt-6 pb-2 first:pt-2 list-none';
                        dividerLi.innerHTML = `
                            <div class="flex justify-between items-center border-b border-slate-200 dark:border-slate-800 pb-2 text-sm font-semibold text-slate-600 dark:text-slate-300">
                                <span>📅 ${session.date}</span>
                                <span class="text-teal-600 dark:text-teal-400 font-medium">รวมวันนี้: ${formatMinutesToReadable(dailyTotals[session.date])}</span>
                            </div>
                        `;
                        historyList.appendChild(dividerLi);
                    }

                    const li = document.createElement('li');
                    li.className = 'bg-white dark:bg-slate-900 p-5 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 flex justify-between items-center gap-4 transition-colors duration-300';
                     
                    const readableDuration = formatMinutesToReadable(session.duration);
                     
                    li.innerHTML = `
                        <div class="space-y-1">
                            <p class="text-base font-medium text-slate-800 dark:text-slate-200">${session.date}</p>
                            <p class="text-sm text-slate-500 dark:text-slate-400 font-medium">${session.startTime} - ${session.endTime}</p>
                        </div>
                        <div class="flex items-center gap-4">
                            <span class="text-lg font-semibold text-teal-600 dark:text-teal-400">${readableDuration}</span>
                            <button onclick="deleteSession(${session.id})" class="text-slate-300 dark:text-slate-600 hover:text-rose-500 dark:hover:text-rose-400 transition-colors p-1">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                                </svg>
                            </button>
                        </div>
                    `;
                    historyList.appendChild(li);
                });
            }
             
            totalStats.textContent = `รวม ${formatMinutesToReadable(totalMinutes)}`;
        }
    </script>
</body>
</html>
