<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meditation Timer | บันทึกการนั่งสมาธิ</title>
    <!-- นำเข้า Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- นำเข้าฟอนต์ Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        /* อนิเมชันจำลองจังหวะการหายใจ (Breathing Effect) */
        .breathing {
            animation: breathe 4s ease-in-out infinite;
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col items-center py-8 px-4 sm:px-6">

    <main class="w-full max-w-md space-y-6">
        
        <!-- Header -->
        <header class="text-center space-y-2">
            <h1 class="text-2xl font-semibold text-teal-800">Meditation Timer</h1>
            <p class="text-sm text-slate-500">บันทึกเวลาแห่งความสงบของคุณ</p>
        </header>

        <!-- โหมดจับเวลาปัจจุบัน (Live Timer) -->
        <section class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 text-center space-y-6">
            <div id="statusIndicator" class="w-24 h-24 mx-auto bg-teal-100 rounded-full flex items-center justify-center text-teal-600 transition-all duration-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            
            <div class="space-y-1">
                <h2 id="timerStatus" class="text-lg font-medium">พร้อมเริ่มต้น</h2>
                <p id="liveDuration" class="text-3xl font-light text-slate-400">00:00</p>
            </div>

            <button id="toggleBtn" onclick="toggleTimer()" class="w-full py-3.5 rounded-xl font-medium text-white bg-teal-600 hover:bg-teal-700 active:scale-95 transition-all shadow-md">
                เริ่มนั่งสมาธิ (เวลาปัจจุบัน)
            </button>
        </section>

        <!-- โหมดระบุเวลาเอง (Manual Entry) -->
        <section class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 space-y-4">
            <h3 class="text-md font-medium text-slate-700">ระบุเวลาด้วยตนเอง</h3>
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1">
                    <label class="text-xs text-slate-500">เวลาเริ่ม</label>
                    <input type="time" id="manualStart" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500">
                </div>
                <div class="space-y-1">
                    <label class="text-xs text-slate-500">เวลาสิ้นสุด</label>
                    <input type="time" id="manualEnd" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500">
                </div>
            </div>
            <button onclick="saveManualEntry()" class="w-full py-2.5 rounded-xl text-sm font-medium text-teal-700 bg-teal-50 hover:bg-teal-100 transition-all">
                บันทึกเวลา
            </button>
        </section>

        <!-- ประวัติการใช้งาน (History) -->
        <section class="space-y-4 pt-4">
            <div class="flex justify-between items-end">
                <h3 class="text-md font-medium text-slate-700">ประวัติการนั่งสมาธิ</h3>
                <span id="totalStats" class="text-xs font-medium text-teal-600 bg-teal-50 px-2 py-1 rounded-md">รวม 0 นาที</span>
            </div>
            <ul id="historyList" class="space-y-3">
                <!-- ข้อมูลประวัติจะถูกเรนเดอร์ที่นี่ผ่าน JS -->
            </ul>
        </section>

    </main>

    <script>
        // State Management
        let isMeditating = false;
        let startTime = null;
        let timerInterval = null;
        let history = JSON.parse(localStorage.getItem('meditationHistory')) || [];

        // DOM Elements
        const toggleBtn = document.getElementById('toggleBtn');
        const statusIndicator = document.getElementById('statusIndicator');
        const timerStatus = document.getElementById('timerStatus');
        const liveDuration = document.getElementById('liveDuration');
        const historyList = document.getElementById('historyList');
        const totalStats = document.getElementById('totalStats');

        // Initialize
        renderHistory();

        // --- Live Timer Logic ---
        function toggleTimer() {
            if (!isMeditating) {
                // เริ่มจับเวลา
                isMeditating = true;
                startTime = new Date();
                
                // อัปเดต UI
                toggleBtn.textContent = 'เลิกนั่งสมาธิ (บันทึกเวลา)';
                toggleBtn.classList.replace('bg-teal-600', 'bg-rose-500');
                toggleBtn.classList.replace('hover:bg-teal-700', 'hover:bg-rose-600');
                
                statusIndicator.classList.add('breathing', 'bg-rose-100', 'text-rose-600');
                statusIndicator.classList.remove('bg-teal-100', 'text-teal-600');
                
                timerStatus.textContent = 'กำลังนั่งสมาธิ...';
                timerStatus.classList.add('text-rose-600');

                // เริ่มรันตัวเลขเวลา
                timerInterval = setInterval(updateLiveDuration, 1000);
            } else {
                // หยุดและบันทึก
                isMeditating = false;
                const endTime = new Date();
                clearInterval(timerInterval);
                
                const durationMinutes = Math.round((endTime - startTime) / 60000);
                
                if (durationMinutes > 0) {
                    saveSession(startTime, endTime, durationMinutes);
                } else {
                    alert('เวลาสั้นเกินไป (น้อยกว่า 1 นาที) จะไม่ถูกบันทึก');
                }

                // รีเซ็ต UI
                toggleBtn.textContent = 'เริ่มนั่งสมาธิ (เวลาปัจจุบัน)';
                toggleBtn.classList.replace('bg-rose-500', 'bg-teal-600');
                toggleBtn.classList.replace('hover:bg-rose-600', 'hover:bg-teal-700');
                
                statusIndicator.classList.remove('breathing', 'bg-rose-100', 'text-rose-600');
                statusIndicator.classList.add('bg-teal-100', 'text-teal-600');
                
                timerStatus.textContent = 'พร้อมเริ่มต้น';
                timerStatus.classList.remove('text-rose-600');
                liveDuration.textContent = '00:00';
            }
        }

        function updateLiveDuration() {
            const now = new Date();
            const diffSeconds = Math.floor((now - startTime) / 1000);
            const minutes = String(Math.floor(diffSeconds / 60)).padStart(2, '0');
            const seconds = String(diffSeconds % 60).padStart(2, '0');
            liveDuration.textContent = `${minutes}:${seconds}`;
        }

        // --- Manual Entry Logic ---
        function saveManualEntry() {
            const startInput = document.getElementById('manualStart').value;
            const endInput = document.getElementById('manualEnd').value;

            if (!startInput || !endInput) {
                alert('กรุณาระบุทั้งเวลาเริ่มและเวลาสิ้นสุด');
                return;
            }

            const today = new Date().toISOString().split('T')[0];
            const startObj = new Date(`${today}T${startInput}`);
            let endObj = new Date(`${today}T${endInput}`);

            // กรณีข้ามวัน (เช่น เริ่ม 23:00 เสร็จ 00:30)
            if (endObj < startObj) {
                endObj.setDate(endObj.getDate() + 1);
            }

            const durationMinutes = Math.round((endObj - startObj) / 60000);
            saveSession(startObj, endObj, durationMinutes);
            
            // เคลียร์ค่า input
            document.getElementById('manualStart').value = '';
            document.getElementById('manualEnd').value = '';
        }

        // --- Core Data & Render Logic ---
        function saveSession(start, end, duration) {
            const session = {
                id: Date.now(),
                date: start.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' }),
                startTime: start.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }),
                endTime: end.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }),
                duration: duration
            };

            history.unshift(session); // เพิ่มข้อมูลใหม่ไว้บนสุด
            localStorage.setItem('meditationHistory', JSON.stringify(history));
            renderHistory();
        }

        function deleteSession(id) {
            history = history.filter(session => session.id !== id);
            localStorage.setItem('meditationHistory', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            historyList.innerHTML = '';
            let totalMinutes = 0;

            if (history.length === 0) {
                historyList.innerHTML = '<li class="text-center text-sm text-slate-400 py-4">ยังไม่มีประวัติการนั่งสมาธิ</li>';
            } else {
                history.forEach(session => {
                    totalMinutes += session.duration;
                    const li = document.createElement('li');
                    li.className = 'bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center';
                    li.innerHTML = `
                        <div>
                            <p class="text-sm font-medium text-slate-700">${session.date}</p>
                            <p class="text-xs text-slate-500">${session.startTime} - ${session.endTime}</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="text-lg font-semibold text-teal-600">${session.duration} <span class="text-xs font-normal">นาที</span></span>
                            <button onclick="deleteSession(${session.id})" class="text-slate-300 hover:text-rose-500 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                                </svg>
                            </button>
                        </div>
                    `;
                    historyList.appendChild(li);
                });
            }
            
            // คำนวณชั่วโมงและนาทีรวม
            const hours = Math.floor(totalMinutes / 60);
            const mins = totalMinutes % 60;
            let totalText = '';
            if(hours > 0) totalText += `${hours} ชม. `;
            totalText += `${mins} นาที`;
            
            totalStats.textContent = `รวม ${totalText}`;
        }
    </script>
</body>
</html>
